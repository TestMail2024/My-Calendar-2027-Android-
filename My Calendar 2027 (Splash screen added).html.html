<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07041a">
<title>Cosmic Calendar 2026–2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Titillium+Web:wght@400;600&display=swap">
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--tx:#f4f1ff;--mut:#9a95c4;--acc:#8B5CF6;--line:rgba(139,92,246,.3);--card:rgba(20,16,50,.84);--cell:rgba(255,255,255,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#07041a radial-gradient(60% 40% at 85% 8%,rgba(124,58,237,.38),transparent),radial-gradient(50% 35% at 5% 55%,rgba(37,99,235,.25),transparent),radial-gradient(50% 30% at 90% 95%,rgba(139,92,246,.3),transparent);color:var(--tx);font-size:14.5px;font-family:"Titillium Web",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{max-width:480px;height:100%;margin:0 auto;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:14px 14px 6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
h2{font-size:15px;font-weight:600;margin:0 0 8px}
.pill{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:rgba(30,24,70,.6);font-weight:500;font-size:12.5px}
.pill.pr{background:linear-gradient(90deg,#8B5CF6,#5b8cff);border:0;box-shadow:0 0 10px rgba(139,92,246,.3)}
.circ{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:rgba(30,24,70,.5);font-size:15px;line-height:1}
.circ:disabled{opacity:.3}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 0 30px rgba(99,70,230,.15) inset}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wk{margin-bottom:6px;text-align:center;font-size:9.5px;letter-spacing:.6px;color:var(--mut)}
.d{position:relative;aspect-ratio:1;border-radius:9px;background:var(--cell);border:1px solid rgba(255,255,255,.04);font-weight:500;font-size:12.5px}
.d.o{color:rgba(154,149,196,.45)}
.d.we:not(.o){color:#c9677a}
.d.we.ev:not(.o){color:#ffb4bf}
.d.ev{background:color-mix(in srgb,var(--c) 55%,transparent);box-shadow:0 0 8px color-mix(in srgb,var(--c) 25%,transparent);border-color:var(--c)}
.d.ev:after{content:"✦";position:absolute;top:2px;right:4px;font-size:7px}
.d.td:before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:2px;background:conic-gradient(from var(--a,0deg),#00e5ff,#8B5CF6,#ff4fa3,#ffb020,#00e5ff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude;pointer-events:none;animation:br 2.8s ease-in-out infinite,spin 3.6s linear infinite}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.d.td{animation:gl 3.6s linear infinite}
@keyframes gl{0%,100%{box-shadow:0 0 14px 1px rgba(0,229,255,.6),inset 0 0 8px rgba(0,229,255,.25)}25%{box-shadow:0 0 14px 1px rgba(139,92,246,.7),inset 0 0 8px rgba(139,92,246,.3)}50%{box-shadow:0 0 14px 1px rgba(255,79,163,.65),inset 0 0 8px rgba(255,79,163,.28)}75%{box-shadow:0 0 14px 1px rgba(255,176,32,.6),inset 0 0 8px rgba(255,176,32,.25)}}
@keyframes br{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.d.td:before,.d.td{animation:none}.d.td:before{opacity:.8}}
.d:focus,.d:focus-visible{outline:none}
.ev-card{display:flex;gap:10px;padding:10px;border-radius:14px;border:1px solid var(--line);background:rgba(10,8,34,.5);margin-top:12px}
.ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;background:color-mix(in srgb,var(--c) 35%,#0b0826);border:1px solid color-mix(in srgb,var(--c) 70%,transparent)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:500;background:color-mix(in srgb,var(--c) 85%,#000)}
.hex{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#d6d0ff;background:rgba(255,255,255,.06);padding:2px 8px;border-radius:999px}
.hex i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.note{color:var(--mut);font-size:12px;line-height:1.5;margin:5px 0 8px}
.sm{padding:4px 12px;border-radius:999px;border:1px solid var(--line);font-weight:500;font-size:11.5px}
.nav{display:flex;margin:6px 14px 10px;padding:6px;border-radius:18px;border:1px solid var(--line);background:rgba(14,11,40,.94)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:10px;font-weight:500;padding:2px 0;position:relative}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .on{color:#a78bfa}.nav .on:after{content:"";position:absolute;bottom:-4px;width:28px;height:2px;border-radius:2px;background:linear-gradient(90deg,#8B5CF6,#4f8cff)}
.li{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font-size:13px;padding:9px 10px;border-radius:14px;background:rgba(10,8,34,.5);border:1px solid var(--line);margin-bottom:10px}
.li small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{padding:5px 12px;font-weight:500;font-size:12px;color:var(--mut)}.seg .on{background:var(--acc);color:#fff}
.set{padding:10px 0;font-size:13px;border-bottom:1px solid rgba(255,255,255,.07)}
.dng{color:#ff8a9b;border-color:#ff8a9b66}
#sheet{position:fixed;inset:0;background:rgba(3,2,14,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.show{display:flex}
.sh{width:100%;max-width:480px;max-height:92%;overflow-y:auto;background:#12103a;border:1px solid var(--line);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:10px;letter-spacing:.6px;color:var(--mut);margin:11px 0 5px;text-transform:uppercase}
input,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;outline:0}
textarea{min-height:52px;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:4px 11px;border-radius:999px;border:1px solid var(--line);font-size:11.5px;font-weight:500}
.chips .on{background:var(--acc);border-color:var(--acc)}
.sw{width:22px;height:22px;padding:0!important;border-radius:50%;background:var(--c);border:2px solid transparent}.sw.on{border-color:#fff}
.acts{display:flex;gap:8px;margin-top:16px}.acts button{flex:1}
#toast{width:max-content;max-width:88vw;text-align:center;position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#2a2260;border:1px solid var(--line);padding:6px 14px;border-radius:999px;font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.show{opacity:1}
.empty{color:var(--mut);text-align:center;font-size:12.5px;padding:12px 0}
.evl{margin-top:16px;padding:0 4px}
.evh{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.er{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:8px 0;font-size:13px;line-height:1.4;border-bottom:1px solid rgba(255,255,255,.06)}
.er b{font-weight:600}
.mh{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 2px;padding-bottom:6px;font-size:12px;font-weight:600;letter-spacing:.4px;color:#c4b5fd;border-bottom:1px solid rgba(167,139,250,.35)}
.mh span:last-child{font-size:11px;min-width:20px;text-align:center;padding:1px 7px;border-radius:999px;background:rgba(139,92,246,.25)}
.cp{position:relative;display:inline-block;flex:none;width:22px;height:22px;border-radius:50%;background:conic-gradient(#f43f5e,#f59e0b,#22c55e,#06b6d4,#6366f1,#d946ef,#f43f5e);border:2px solid transparent}
.cp:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--c);pointer-events:none}
.cp.on{border-color:#fff}
.cp input{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px);padding:0;border:0;border-radius:50%;opacity:0;cursor:pointer}
.dot{flex:none;width:6px;height:6px;border-radius:50%;background:var(--c);margin-top:6px}
.grid.mn{animation:cn .32s cubic-bezier(.22,.8,.3,1) backwards}
.grid.mp{animation:cq .32s cubic-bezier(.22,.8,.3,1) backwards}
@keyframes cn{from{opacity:0;transform:translate3d(24px,0,0)}}
@keyframes cq{from{opacity:0;transform:translate3d(-24px,0,0)}}
h1.tn{animation:tn .35s cubic-bezier(.22,.8,.3,1) backwards}
h1.tp{animation:tq .35s cubic-bezier(.22,.8,.3,1) backwards}
@keyframes tn{from{opacity:0;transform:translate3d(18px,0,0)}}
@keyframes tq{from{opacity:0;transform:translate3d(-18px,0,0)}}
.evl.fi{animation:fi .35s .1s ease-out backwards}
@keyframes fi{from{opacity:0;transform:translate3d(0,8px,0)}}
h1,h2,.pill,.wk,.d,.nav button,.evh,.mh,.sm,.seg button,label{font-family:"Rajdhani","Titillium Web",system-ui,sans-serif}
h1{font-size:27px;font-weight:700;letter-spacing:.2px}
h2{font-size:18px;font-weight:600}
.d{font-size:18px;font-weight:600}
.pill{font-size:14.5px;font-weight:600}
.wk{font-size:12px;font-weight:600;letter-spacing:1px}
.nav button{font-size:12.5px;font-weight:600}
.sm,.seg button{font-size:13.5px;font-weight:600}
.evh,.mh{font-weight:600}
label{font-size:12px;font-weight:600}
#view{overflow-x:hidden}
.logo{height:30px;width:auto;display:block}
.shk2{animation:shk2 .5s linear}
@keyframes shk2{0%,100%{transform:translate3d(0,0,0)}20%{transform:translate3d(-3px,2px,0)}40%{transform:translate3d(3px,-2px,0)}60%{transform:translate3d(-2px,-1px,0)}80%{transform:translate3d(2px,1px,0)}}
.shk{animation:shk .45s linear}
@keyframes shk{0%,100%{transform:translate3d(0,0,0)}20%{transform:translate3d(-6px,3px,0)}40%{transform:translate3d(6px,-3px,0)}60%{transform:translate3d(-4px,-2px,0)}80%{transform:translate3d(3px,2px,0)}}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,2,14,.55);z-index:25;padding:24px}
#pop.show{display:flex}
.pc{width:100%;max-width:340px;background:#12103a;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:pin .18s ease-out}
@keyframes pin{from{opacity:0;transform:scale(.92)}}
.pd{font-family:"Rajdhani","Titillium Web",system-ui,sans-serif;font-size:14px;font-weight:600;letter-spacing:.8px;color:var(--mut);text-transform:uppercase}
.pe{display:flex;gap:10px;align-items:flex-start;margin-top:14px}
.pe .dot{margin-top:8px}
.pt{font-size:18px;font-weight:600;line-height:1.3;word-break:break-word}
.d{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.d.hold{animation:hold 3s linear forwards}
@keyframes hold{to{transform:scale(.9);filter:brightness(1.4)}}
#fw{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
.tg{position:relative;flex:none;width:42px;height:24px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line);transition:background .2s}
.tg:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--acc)}.tg.on:after{transform:translateX(18px)}
#view.pgn>*{animation:pgn .3s cubic-bezier(.22,.8,.3,1) backwards}
#view.pgp>*{animation:pgq .3s cubic-bezier(.22,.8,.3,1) backwards}
@keyframes pgn{from{opacity:0;transform:translate3d(22px,0,0)}}
@keyframes pgq{from{opacity:0;transform:translate3d(-22px,0,0)}}
@media (prefers-reduced-motion:reduce){.grid .d,h1,.evl,#view>*{animation:none!important}}
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#06031a;pointer-events:none;transform:translateZ(0)}
#bg:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 40%,transparent 35%,rgba(3,2,14,.7))}
#bg i{position:absolute;width:75vmax;height:75vmax;border-radius:50%;opacity:.5;will-change:transform}
#bg i:nth-child(n+4){display:none}
#bg i:nth-child(1){top:-30%;left:-45%;background:radial-gradient(circle,#5b21b6,transparent 62%);animation:b1 26s ease-in-out infinite alternate}
#bg i:nth-child(2){top:15%;left:25%;background:radial-gradient(circle,#1e40af,transparent 62%);animation:b2 32s ease-in-out infinite alternate}
#bg i:nth-child(3){bottom:-35%;left:-35%;background:radial-gradient(circle,#9d174d,transparent 62%);animation:b3 29s ease-in-out infinite alternate}
#bg i:nth-child(4){top:40%;left:10%;opacity:.3;background:radial-gradient(circle,#c2410c,transparent 60%);animation:b2 38s ease-in-out infinite alternate-reverse}
#bg i:nth-child(5){top:-15%;right:-50%;opacity:.32;background:radial-gradient(circle,#0f766e,transparent 62%);animation:b3 34s ease-in-out infinite alternate-reverse}
@keyframes b1{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(30%,25%,0)}100%{transform:translate3d(10%,55%,0)}}
@keyframes b2{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(-35%,20%,0)}100%{transform:translate3d(-10%,-30%,0)}}
@keyframes b3{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(35%,-25%,0)}100%{transform:translate3d(55%,-5%,0)}}
.wv{position:absolute;left:0;width:200%;opacity:.16;will-change:transform}
.w1{bottom:6%;height:24%;animation:wv 30s linear infinite}
.w2{bottom:-2%;height:30%;opacity:.13;animation:wv 46s linear infinite reverse}
.w3{top:4%;height:20%;opacity:.09;transform:scaleY(-1);animation:wv 54s linear infinite}
@keyframes wv{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.w3{display:none}
.nav svg .f{fill:transparent;transition:fill .3s}
.nav .on svg .f{fill:currentColor;fill-opacity:.25}
.nav .on svg{animation:ip .55s cubic-bezier(.34,1.56,.64,1)}
.nav button svg{transition:transform .15s}
.nav button:active svg{transform:scale(.85)}
.nav [data-v=high].on svg{animation:sp .65s cubic-bezier(.34,1.56,.64,1)}
.nav .on svg .dt{transform-box:fill-box;transform-origin:center;animation:dt .5s both}
.nav .on svg .dt:nth-child(4){animation-delay:.08s}.nav .on svg .dt:nth-child(5){animation-delay:.16s}.nav .on svg .dt:nth-child(6){animation-delay:.24s}.nav .on svg .dt:nth-child(7){animation-delay:.32s}
.nav .on .gr{transform-box:view-box;transform-origin:12px 12px;animation:gr .8s cubic-bezier(.2,.8,.2,1)}
@keyframes ip{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes dt{0%{transform:scale(0);opacity:0}60%{transform:scale(2.4)}100%{transform:scale(1);opacity:1}}
@keyframes gr{from{transform:rotate(-120deg)}to{transform:rotate(0)}}
@keyframes sp{0%{transform:scale(.5) rotate(-80deg)}60%{transform:scale(1.25) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.nav svg,.nav svg *{animation:none!important}}
@media (prefers-reduced-motion:reduce){#bg i,.wv{animation:none}}
.ft{margin:22px 4px 10px;padding-top:14px;border-top:1px solid rgba(167,139,250,.28);text-align:center;font-size:11.5px;line-height:1.55;color:var(--mut)}
.ft b{display:block;font-size:12.5px;letter-spacing:.6px;color:#c4b5fd;margin-bottom:4px}
.ft p{margin:0 0 8px}
.ft a{color:#a78bfa;text-decoration:underline;word-break:break-all}
.ft .cr{font-weight:600;letter-spacing:.3px}
#splash{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,4vh,34px);padding:24px;box-sizing:border-box;background:radial-gradient(60% 40% at 85% 8%,rgba(124,58,237,.38),transparent),radial-gradient(50% 35% at 5% 55%,rgba(37,99,235,.28),transparent),radial-gradient(50% 30% at 90% 95%,rgba(139,92,246,.32),transparent),#07041a;transition:opacity .55s ease,visibility .55s ease,transform .55s ease}
#splash.out{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
#splash .sl{width:min(88vw,520px);height:auto;display:block;filter:drop-shadow(0 0 22px rgba(139,92,246,.55)) drop-shadow(0 0 48px rgba(59,130,246,.35));animation:slIn .9s cubic-bezier(.2,.8,.2,1) both}

@keyframes slIn{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}

function calView(){
 const first=new Date(vy,vm,1),lead=(first.getDay()-S.ws+7)%7,dim=new Date(vy,vm+1,0).getDate(),rows=Math.ceil((lead+dim)/7);
 const names=['SUN','MON','TUE','WED','THU','FRI','SAT'];const wk=names.map((_,i)=>`<div>${names[(i+S.ws)%7]}</div>`).join('');
 let cells='';for(let i=0;i<rows*7;i++){const d=new Date(vy,vm,1-lead+i),k=key(d.getFullYear(),d.getMonth(),d.getDate()),o=d.getMonth()!==vm,ev=o?null:evOn(k)[0];
  cells+=`<button class="d${o?' o':''}${d.getDay()%6===0?' we':''}${ev?' ev':''}${k===todayKey?' td':''}${k===sel?' sl':''}" ${ev?`style="--c:${ev.color}"`:''} data-a="sel" data-k="${k}">${d.getDate()}</button>`}
 const list=monthEv(vy,vm),mn=new Date(vy,vm,1).toLocaleDateString('en-US',{month:'long'});
 return `<div class="row">${LOGO}<div class="row"><button class="pill" data-a="today">Today</button><button class="pill pr" data-a="add">+ Add Event</button></div></div>
 <div class="row" style="margin:12px 0"><button class="circ" data-a="prev" ${vy*12+vm<=MIN?'disabled':''}>‹</button><h1 class="${mdir?(mdir>0?'tn':'tp'):''}" style="flex:1;text-align:center;text-transform:uppercase;letter-spacing:1px;font-size:24px">${new Date(vy,vm,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h1><button class="circ" data-a="next" ${vy*12+vm>=MAX?'disabled':''}>›</button></div>
 <div class="card"><div class="wk">${wk}</div><div class="grid${mdir?(mdir>0?' mn':' mp'):''}">${cells}</div></div>
 <div class="evl${mdir?' fi':''}"><div class="evh">Events in ${mn}</div>${list.length?list.map(evRow).join(''):'<div class="empty">No events marked this month.</div>'}</div>`}
function highView(){
 const l=[...S.ev].sort((a,b)=>a.date.localeCompare(b.date));
 return `<div class="row" style="margin-bottom:12px">${LOGO}</div><h1>Highlights</h1><p class="note">${l.length} marked date${l.length===1?'':'s'} across 2026–2027. Tap one to edit.</p>`+(l.length?l.map((e,i)=>(i===0||e.date.slice(0,7)!==l[i-1].date.slice(0,7)?`<div class="evh mh"><span>${mh(e.date)}</span><span>${l.filter(x=>x.date.slice(0,7)===e.date.slice(0,7)).length}</span></div>`:'')+`<button class="er" data-a="edit" data-id="${e.id}"><span class="dot" style="--c:${e.color}"></span><span style="color:${e.color}"><b>${dm(e.date)} ${e.date.slice(0,4)}</b> | ${wd(e.date)} - ${esc(e.title)}${e.fw||e.nk||e.lf||e.rs||e.rn||e.cr?' ✺':''}</span></button>`).join(''):'<div class="empty">Nothing marked yet.</div>')}
function setView(){
 return `<div class="row" style="margin-bottom:12px">${LOGO}</div><h1>Settings</h1><div class="card" style="margin-top:16px"><div class="set row"><span>Week starts on</span><div class="seg"><button data-a="ws" data-v="0" class="${S.ws===0?'on':''}">Sun</button><button data-a="ws" data-v="1" class="${S.ws===1?'on':''}">Mon</button></div></div>
 <div class="set row"><span>Backup events</span><div class="row" style="gap:6px"><button class="sm" data-a="bk">Save file</button><button class="sm" data-a="bc">Copy</button></div></div><div class="set row"><span>Restore backup</span><div class="row" style="gap:6px"><button class="sm" data-a="rf">From file</button><button class="sm" data-a="rp">Paste</button></div></div>${pOpen?`<div class="set"><textarea id="pt" placeholder="Paste your backup text here"></textarea><div class="acts" style="margin-top:10px"><button class="pill pr" data-a="rr">Restore now</button></div></div>`:''}<div class="set row"><span>Restore sample holidays</span><button class="sm" data-a="reset">Restore</button></div>

 `}
